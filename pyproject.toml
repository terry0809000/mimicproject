[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-sbdh-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for SBDH extraction from MIMIC-III social history sections"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Research Team"}]
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scikit-learn==1.6.1",
  "scipy==1.14.1",
  "matplotlib==3.10.0",
  "xgboost==2.1.3",
  "transformers==4.48.3",
  "datasets==3.2.0",
  "torch==2.5.1",
  "pyyaml==6.0.2",
  "pydantic==2.10.6",
  "typer==0.15.1",
  "rich==13.9.4",
  "loguru==0.7.3",
  "joblib==1.4.2",
  "psutil==6.1.1",
  "imbalanced-learn==0.13.0",
  "jinja2==3.1.5",
  "tabulate==0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "nbformat==5.10.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
